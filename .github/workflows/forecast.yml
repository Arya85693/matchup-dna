# The forecasting job (Phase 8): every 30 minutes, the full job — new forecasts for every eligible match, results for
# finished ones, the ledger, and the site. Running often is what makes every match listed at least 30 minutes before
# its start get a forecast; a forecast already stored is never changed, and a re-run with identical inputs records
# "unchanged". (Twice a day, a match first listed after one run and starting before the next was missed.)
#
# The repository variable STATE_SLOT chooses the store: "shadow" (default; a separate copy, never the official record,
# nothing uploaded to the site, no ledger commit) or "live" (the official store, set at the switch-over).
name: Forecast
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: store-${{ vars.STATE_SLOT || 'shadow' }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash   # the steps are bash; Windows machines provide it through Git
jobs:
  forecast:
    runs-on: windows-latest   # same maths library as the laptop: inputs identical to the last digit (8D)
    timeout-minutes: 30
    env:
      SLOT: ${{ vars.STATE_SLOT == 'live' && 'live' || 'shadow' }}
      STORE: data/store/${{ vars.STATE_SLOT == 'live' && 'live' || 'shadow' }}.sqlite
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      R2_BUCKET: matchup-dna-site
      R2_UPLOAD_ACCESS_KEY_ID: ${{ secrets.R2_UPLOAD_ACCESS_KEY_ID }}
      R2_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_UPLOAD_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      - name: Store
        run: node web/scripts/state.mjs pull-store "$SLOT"
      - name: Preflight (hash chain, probabilities, code fingerprint)
        run: python scripts/cloud/gate.py preflight --store "$STORE"
      - name: Shadow runs keep their own ledger
        if: env.SLOT != 'live'
        # The checked-out forecasts/ledger.jsonl is the official ledger; a shadow store's chain is a different history,
        # so the ledger's prefix check (correctly) refuses it. In shadow mode the job writes a fresh ledger from the
        # shadow store, which is never committed.
        run: rm -f forecasts/ledger.jsonl
      - name: Forecast, settle, ledger
        run: python -m matchup_dna.forecasting daily --store "$STORE"
      - name: ITF forecasts (P2, about every two hours)
        # Separate store, ledger and code (matchup_dna/itf_*.py); nothing here touches P1. A failure here never stops
        # the main-tour forecasts, the publish or the ledger commit.
        if: env.SLOT == 'live'
        continue-on-error: true
        run: |
          if [ ! -f experiments/itf_prospective_protocol.json ]; then echo "P2 is not frozen yet: no ITF run"; exit 0; fi
          node web/scripts/state.mjs pull-store itf --allow-missing
          if python -m matchup_dna.itf_live due; then
            python -m matchup_dna.itf_live run
            node web/scripts/state.mjs push-store itf
            node web/scripts/state.mjs pack itfraw data/raw/flashscore data/raw/tennisexplorer data/raw/itf
          fi
      - name: Save the store and the ESPN archive
        run: |
          node web/scripts/state.mjs push-store "$SLOT"
          node web/scripts/state.mjs pack raw data/raw
      - name: Publish
        run: |
          python -m web.publisher.publish --store "$STORE"
          if [ "$SLOT" = "live" ]; then node web/scripts/upload-snapshot.mjs snapshot; else echo "shadow: not uploaded"; fi
      - name: Commit the ledger
        if: env.SLOT == 'live'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/ledger.jsonl
          if [ -f forecasts/itf_ledger.jsonl ]; then git add forecasts/itf_ledger.jsonl; fi
          if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
          git commit -m "Record forecasts from the scheduled run (Actions run ${{ github.run_id }})"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
