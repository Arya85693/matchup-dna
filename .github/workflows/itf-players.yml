# The ITF board's player profiles (the ITF extension): once a day, after the morning ITF runs. The same pages as the
# main-tour Players board, rated with the ITF model's Elo.
#
# Its own concurrency group: it never opens a forecast store (main tour or ITF), so it never waits for, or holds up,
# the forecasting job. It reads the ITF page archive that the forecasting job's ITF step uploads, and writes only the
# site's itf-history area.
name: ITF players
on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itf-players
  cancel-in-progress: false
defaults:
  run:
    shell: bash   # the steps are bash; Windows machines provide it through Git
jobs:
  itf-players:
    if: vars.STATE_SLOT == 'live'
    runs-on: windows-latest   # same maths library as the laptop and the forecasting job
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      R2_BUCKET: matchup-dna-site
      R2_UPLOAD_ACCESS_KEY_ID: ${{ secrets.R2_UPLOAD_ACCESS_KEY_ID }}
      R2_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_UPLOAD_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - name: ITF player export and upload
        run: |
          if [ ! -f experiments/itf_prospective_protocol.json ]; then echo "P2 is not frozen yet: no ITF board"; exit 0; fi
          python -m web.publisher.itf_players
          if [ -f web/.data/itf-history/v1/manifest.json ]; then node web/scripts/upload-snapshot.mjs itf-history; fi
