# Phase 8 dry run: replay past days into a separate replay store (never a forecast record), so its inputs can be
# compared byte for byte with the same replay on the laptop. Started by hand from the Actions tab.
name: Rehearse
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to replay (YYYY-MM-DD, space-separated)
        default: "2026-10-22 2026-10-29"
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - name: Replay
        run: |
          for d in $DAYS; do [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad day: $d"; exit 1; }; done
          python -m matchup_dna.forecasting rehearse --days $DAYS
      - name: Keep the replay store for comparison
        run: |
          store=$(ls -t results/phase6/rehearsal/replay_*.sqlite | head -1)
          node web/scripts/state.mjs put "checks/rehearsal/github-${{ github.run_id }}.sqlite" "$store"
